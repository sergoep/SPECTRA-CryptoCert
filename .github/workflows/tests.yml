name: CryptoCert verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Run independent verifier
        run: python verifier/verify.py

      - name: Verify CryptoCert certificate
        run: python verifier/verify_certificate.py

      - name: Run recurrence vs matched-control experiment
        run: python examples/recurrence_vs_matched_control.py

      - name: Verify recurrence-control benchmark
        run: |
          python - <<'PY'
          from examples.recurrence_vs_matched_control import main

          result = main(n=100, seed=20261021)

          assert result["target_L4_scalar"] == 0xD8, (
              f'Expected target scalar 0xD8, got {result["target_L4_scalar"]!r}'
          )
          assert result["control_L4_scalar_hits"] == 0, (
              f'Expected 0/100 scalar-fourth-power controls, '
              f'got {result["control_L4_scalar_hits"]}/100'
          )

          print("[PASS] target L^4 = 0xD8 I")
          print("[PASS] recurrence-control benchmark reproduced: 0/100")
          PY

      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check Lean recurrence proof
        run: |
          $HOME/.elan/bin/lean lean/Recurrence.lean
